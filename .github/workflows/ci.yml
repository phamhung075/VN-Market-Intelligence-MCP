name: CI

# Trigger on every push to main and every PR targeting main.
"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: bun test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # All `run` steps execute from apps/mcp-server by default.
    defaults:
      run:
        working-directory: apps/mcp-server

    steps:
      - uses: actions/checkout@v4

      # Install Bun — version is sourced from .tool-versions at repo root (single source of truth).
      # Note: bun-version-file resolves from repo root regardless of defaults.run.working-directory.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions

      # Cache bun install to avoid re-downloading packages on every run.
      # hashFiles resolves from repo root.
      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('apps/mcp-server/bun.lock') }}
          restore-keys: bun-

      # Install dependencies deterministically — fails if bun.lock is stale.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Run the full test suite via per-file process isolation runner.
      # Coverage is suppressed via bunfig.toml [test] coverage=false (FIX-CI-COVERAGE-OFF-MECHANISM).
      # bun 1.3.13 does not accept --coverage=false (parse error); bunfig setting is the only
      # verified mechanism to suppress the OOM-crashing coverage table on CI runners.
      # Local dev coverage: bun run test:cov (see scripts/test-coverage.sh).
      # Per-file isolation script runs each test file in its own bun process (P=16 parallelism),
      # eliminating ESM cache contamination. The script writes summary to $GITHUB_STEP_SUMMARY.
      - name: Run tests (per-file isolation)
        run: bash ../../scripts/ci-per-file-isolation.sh 16

  mcp-server-eslint:
    name: mcp-server-eslint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: apps/mcp-server

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('apps/mcp-server/bun.lock') }}
          restore-keys: bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Architecture fence — eslint-plugin-boundaries Fence-A/B (domain/application
      # layer isolation, eslint.config.mjs). Scoped to src/ (matches the config's own
      # `files: ["src/**/*.ts"]`) — `eslint .` from the app root also globs
      # node_modules and trips on a vendored package's own unrelated eslint.config.js
      # (fast-uri ships one referencing an uninstalled `neostandard` plugin) —
      # verified 2026-07-29 (FACTORY-GUARD-CI-TSBOUNDARIES-IMPL); scoping to src/
      # avoids it and matches this job's actual intent (lint our code, not vendor code).
      - name: Run eslint (architecture fence)
        run: ./node_modules/.bin/eslint src/ --max-warnings=0

  news-fetch-eslint:
    name: news-fetch-eslint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: apps/news-fetch

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('apps/news-fetch/bun.lock') }}
          restore-keys: bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Architecture fence — eslint-plugin-boundaries Fence-A/B/C (primitive/module/
      # infrastructure layer isolation, eslint.config.mjs). Uses the package's own
      # lint:ci script (eslint src/ --max-warnings 0) — same src/-scoped pattern as
      # mcp-server-eslint above.
      - name: Run eslint (architecture fence)
        run: bun run lint:ci

  frontend-eslint:
    name: frontend-eslint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('apps/frontend/bun.lock') }}
          restore-keys: bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Architecture fence — eslint-plugin-boundaries Fence-A/B/C (formatter/domain/
      # view-model/api-client layer isolation, eslint.config.mjs). Uses the package's
      # own lint:fence script — the general "lint" script is unrelated and already
      # broken independently of this fence (--ignore-path is not a valid flag on the
      # installed ESLint 8.57.1 flat-config CLI); lint:fence is the correct, working,
      # boundaries-scoped entry point.
      - name: Run eslint (architecture fence)
        run: bun run lint:fence

  go-lint:
    name: go-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/technical-analysis/go.mod
          cache-dependency-path: apps/technical-analysis/go.sum

      # Run golangci-lint (depguard Fence-A/B/C) against the technical-analysis service.
      # working-directory is equivalent to: cd apps/technical-analysis && golangci-lint run --config .golangci.yml
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7.0.0
        with:
          version: v2.0
          working-directory: apps/technical-analysis
          args: --config .golangci.yml

  macro-go-lint:
    name: Macro Indicators Go Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/macro-indicators/go.mod
          cache-dependency-path: apps/macro-indicators/go.sum

      # Run golangci-lint (depguard Fence-A/B/C) against the macro-indicators service.
      # working-directory is equivalent to: cd apps/macro-indicators && golangci-lint run --config .golangci.yml
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7.0.0
        with:
          version: v2.0
          working-directory: apps/macro-indicators
          args: --config .golangci.yml

  stock-price-go-lint:
    name: Stock Price Go Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/stock-price/go.mod
          cache-dependency-path: apps/stock-price/go.sum

      # Run golangci-lint (depguard Fence-A/B/C) against the stock-price service.
      # working-directory is equivalent to: cd apps/stock-price && golangci-lint run --config .golangci.yml
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7.0.0
        with:
          version: v2.0
          working-directory: apps/stock-price
          args: --config .golangci.yml

  alert-engine-go-lint:
    name: Alert Engine Go Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: apps/alert-engine

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/alert-engine/go.mod
          cache-dependency-path: apps/alert-engine/go.sum

      # Run golangci-lint (depguard Fence-A/B/C) against the alert-engine service.
      # working-directory is equivalent to: cd apps/alert-engine && golangci-lint run --config .golangci.yml
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7.0.0
        with:
          version: v2.0
          working-directory: apps/alert-engine
          args: --config .golangci.yml

  api-gateway-go-lint:
    name: API Gateway Go Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api-gateway/go.mod
          cache-dependency-path: apps/api-gateway/go.sum

      # Run golangci-lint (depguard Fence-A/B/C) against the api-gateway service.
      # Fence-A also bans net/http + net/http/httputil in pkg/primitive/ (pure-compute tier).
      # working-directory is equivalent to: cd apps/api-gateway && golangci-lint run --config .golangci.yml
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7.0.0
        with:
          version: v2.0
          working-directory: apps/api-gateway
          args: --config .golangci.yml

  kinh-dich-go-lint:
    name: Kinh Dich Go Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/kinh-dich-service/go.mod
          cache-dependency-path: apps/kinh-dich-service/go.sum

      # Run golangci-lint (depguard Fence-A/B/C) against the kinh-dich-service.
      # Fence-A sister-primitive allowlist: nuclear_hexagram may import hexagram_resolver + hao_encoder (OQ-6).
      # working-directory is equivalent to: cd apps/kinh-dich-service && golangci-lint run --config .golangci.yml
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7.0.0
        with:
          version: v2.0
          working-directory: apps/kinh-dich-service
          args: --config .golangci.yml

  news-fetch-go-lint:
    name: News Fetch Go Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/news-fetch/go.mod
          cache-dependency-path: apps/news-fetch/go.sum

      # apps/news-fetch carries its own go.mod/.golangci.yml (Fence-A/B depguard,
      # GFD-9) alongside the TS/Bun HTTP service — previously zero CI job of any
      # kind (FACTORY-GUARD-CI-TSBOUNDARIES-IMPL, 2026-07-24 architect brief §0),
      # so its depguard fences were unenforced dead config. Mirrors the 6 existing
      # go-lint jobs above.
      # working-directory is equivalent to: cd apps/news-fetch && golangci-lint run --config .golangci.yml
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7.0.0
        with:
          version: v2.0
          working-directory: apps/news-fetch
          args: --config .golangci.yml

  py-lint:
    name: py-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # Install Python 3.11 for pdf-extractor import-linter fence.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Install import-linter. pip cache optional — kept lean for offline evidence model.
      - name: Install import-linter
        run: pip install import-linter

      # Run Fence-A/B contracts against apps/pdf-extractor domain layer.
      # Exit non-zero = architecture violation — build fails.
      # Config discovered automatically from pyproject.toml when run from package directory.
      - name: Run lint-imports (Fence-A/B)
        working-directory: apps/pdf-extractor
        run: lint-imports --config pyproject.toml

  size-lint:
    name: size-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # Pure bash/jq/wc — no bun/go/python toolchain needed, cheapest job in the pipeline.
      # Baseline/ratchet CI guardrail for source-file size + size-justification headers.
      # See docs/architecture-briefs/2026-07-24-factory-guard-ci-size-lint-justification.md
      # and docs/data/size-lint-baseline.json (grandfathered debt snapshot).
      - name: Run size-lint-justification --check
        run: bash scripts/audits/size-lint-justification.sh --check

  metric-mask-lint:
    name: metric-mask-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # Pure bash/awk — no bun/go/python toolchain needed, cheapest job in the pipeline.
      # Zero-tolerance CI guardrail against silently fabricating a plausible-looking
      # confidence/score/impact/magnitude/probability value via `?? <non-zero-literal>`
      # (or `||` / Python `or` / destructuring-or-param default) instead of honestly
      # propagating an absence. NOT baseline/ratchet like size-lint — live debt was 4
      # lines fixed in the same task that shipped this gate, so it opens at zero.
      # See docs/architecture-briefs/2026-07-24-factory-guard-ci-metric-mask-lint.md
      - name: Run metric-mask-lint --check
        run: bash scripts/audits/metric-mask-lint.sh --check

# AC-8 (optional) — Branch protection setup:
# To require CI jobs before merging to main, go to:
#   GitHub repo > Settings > Branches > Add branch protection rule
#   Branch name pattern: main
#   Check: "Require status checks to pass before merging"
#   Search for and add status checks: "bun test", "go-lint", "macro-go-lint", "stock-price-go-lint"
