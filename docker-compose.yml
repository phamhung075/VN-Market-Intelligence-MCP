version: "3.9"

# ── VN Market Intelligence — DDD Microservices ──────────────────────────────
#
# Phase 0: mcp-server only (existing monolith moved to apps/mcp-server/).
# Phase 1: pdf-extractor (port 5001) + rag-service (port 5002) added.
# Phase 2: stock-price (5000), technical-analysis (5003), macro-indicators (5004),
#          kinh-dich-service (5005), alert-engine (5006), api-gateway (4000) added.
#
# Service port map:
#   mcp-server          3000
#   api-gateway         4000  (Phase 2a)
#   stock-price         5000  (Phase 2a)
#   pdf-extractor       5001  (Phase 1a)
#   rag-service         5002  (Phase 1b)
#   technical-analysis  5003  (Phase 2a)
#   macro-indicators    5004  (Phase 2a)
#   kinh-dich-service   5005  (Phase 2b)
#   alert-engine        5006  (Phase 2b)
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Phase 0: MCP Server (TypeScript/Bun) ────────────────────────────────
  mcp-server:
    build:
      # Use monorepo root as context so bctc-schema.ts + mcp.config.json are accessible
      context: .
      dockerfile: apps/mcp-server/Dockerfile
    ports:
      - "3000:3000"
    volumes:
      # Named volume — stays inside Docker VM filesystem (no macOS virtualisation boundary)
      # Prevents Virtualization.VirtualMachine from holding fd on market.db-shm across stops.
      - market_data:/app/data
      # Mount config
      - ./mcp.config.json:/app/mcp.config.json:ro
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - DB_PATH=/app/data/market.db
      # Route SSC iboard API calls through VPS (Vietnam IP, no geo-block).
      # iboard-query.ssc.vn is NXDOMAIN from France/Docker.
      # VPS proxy server: vps-scripts/vps-proxy-server.js (port 8765, systemd vn-vps-proxy.service).
      - SSC_IBOARD_BASE_URL=http://125.212.251.27:8765/proxy/ssc-iboard
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── Phase 1a: PDF Extractor (Python/FastAPI) ─────────────────────────────
  pdf-extractor:
    build:
      context: apps/pdf-extractor
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    volumes:
      - market_data:/app/data
    environment:
      - DB_PATH=/app/data/pdf_extractor.db
      - STORAGE_DIR=/app/data/extractions
      - LOG_LEVEL=INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Phase 1b: RAG Service (Python/FastAPI) ──────────────────────────────
  rag-service:
    build:
      context: apps/rag-service
      dockerfile: Dockerfile
    ports:
      - "5002:5002"
    volumes:
      # Shared LanceDB + model cache with mcp-server
      - market_data:/app/data
    environment:
      - LANCEDB_PATH=/app/data/lancedb
      - DB_PATH=/app/data/rag_service.db
      - EMBEDDING_CACHE_DIR=/app/data/models
      - LOG_LEVEL=INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Phase 2a: Technical Analysis (TypeScript/Bun) ───────────────────────
  technical-analysis:
    build:
      context: apps/technical-analysis
      dockerfile: Dockerfile
    ports:
      - "5003:5003"
    volumes:
      - market_data:/app/data
    environment:
      - PORT=5003
      - DB_PATH=/app/data/market.db
      - DB_READONLY=true                     # documentation signal; code opens readonly:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── Phase 2a: Macro Indicators (TypeScript/Bun) ─────────────────────────
  macro-indicators:
    build:
      context: apps/macro-indicators
      dockerfile: Dockerfile
    ports:
      - "5004:5004"
    volumes:
      - market_data:/app/data
    environment:
      - PORT=5004
      - DB_PATH=/app/data/market.db
      - DB_READONLY=true                     # documentation signal; code opens readonly:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── Phase 2a: Stock Price (TypeScript/Bun) ──────────────────────────────
  stock-price:
    build:
      context: apps/stock-price
      dockerfile: Dockerfile
    ports:
      - "5010:5000"
    volumes:
      - market_data:/app/data
    environment:
      - PORT=5000
      - DB_PATH=/app/data/market.db          # kept: Tier1/2 fallback still reads market for history
      - STOCK_PRICE_DB_PATH=/app/data/stock_price.db   # write target: isolated from market.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── Phase 2a: API Gateway (TypeScript/Bun) ──────────────────────────────
  api-gateway:
    build:
      context: apps/api-gateway
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - MCP_URL=http://mcp-server:3000
      - PDF_URL=http://pdf-extractor:5001
      - RAG_URL=http://rag-service:5002
      - TA_URL=http://technical-analysis:5003
      - MACRO_URL=http://macro-indicators:5004
      - STOCK_URL=http://stock-price:5000
      - KINH_DICH_URL=http://kinh-dich-service:5005
      - ALERT_URL=http://alert-engine:5006
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Phase 2b: Kinh Dich Service (TypeScript/Bun) ────────────────────────
  kinh-dich-service:
    build:
      context: apps/kinh-dich-service
      dockerfile: Dockerfile
    ports:
      - "5005:5005"
    volumes:
      - market_data:/app/data
    environment:
      - PORT=5005
      - DB_PATH=/app/data/market.db
      - DB_READONLY=true                     # documentation signal; code opens readonly:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── Phase 2b: Alert Engine (TypeScript/Bun) ──────────────────────────────
  alert-engine:
    build:
      context: apps/alert-engine
      dockerfile: Dockerfile
    ports:
      - "5006:5006"
    volumes:
      - market_data:/app/data
    environment:
      - PORT=5006
      - ALERT_ENGINE_DB_PATH=/app/data/alert_engine.db   # write target: isolated from market.db
      # DB_PATH removed — alert-engine no longer reads market.db
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5006/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

# ── Named volumes ─────────────────────────────────────────────────────────────
# market_data: replaces ./data bind-mount to eliminate macOS virtualisation
# boundary (Virtualization.VirtualMachine fd hold on market.db-shm → torn SHM
# write → SQLite "malformed disk image" on container crash).
# Data lives entirely inside the Docker VM filesystem — durable across stops.
volumes:
  market_data:
    driver: local
