version: '3.9'
services:
  mcp-server:
    build:
      context: .
      dockerfile: apps/mcp-server/Dockerfile
    shm_size: 256mb
    ports:
    - 3000:3000
    - 4004:3000
    volumes:
    - market_data:/app/data
    - ./data/pdfs:/app/data/pdfs
    - ./mcp.config.json:/app/mcp.config.json:ro
    - ./reports:/app/reports
    - ./docs/agent-memory:/app/docs/agent-memory
    - ./docs/data/project-stats.json:/app/docs/data/project-stats.json:ro
    - ./docs/data/stock-classification.json:/app/docs/data/stock-classification.json:ro
    - ./docs/data/alert-verdicts.json:/app/docs/data/alert-verdicts.json:ro
    - ./docs/data/bctc-eval-thresholds.json:/app/docs/data/bctc-eval-thresholds.json:ro
    - ./docs/data/daily-dashboard.json:/app/docs/data/daily-dashboard.json
    - ./docs/data/orch:/app/docs/data/orch
    - /Users/admin/.ssh/id_rsa:/run/secrets/vps_ssh_key:ro
    - bctc-page-images:/data/bctc-page-images
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      DB_PATH: /app/data/market.db
      APP_ENV: production
      COORDINATION_DB_PATH: /app/data/coordination.db
      SSC_IBOARD_BASE_URL: http://125.212.251.27:8765/proxy/ssc-iboard
      BCTC_DISCOVER_URL: http://125.212.251.27:8765/proxy/bctc-discover
      MUASAMCONG_VPS_PROXY_URL: http://125.212.251.27:8765/proxy/muasamcong
      PDF_EXTRACTOR_URL: http://pdf-extractor:5001
      GATEWAY_URL: http://api-gateway:4000
      STOCK_PRICE_URL: http://stock-price:5000
      RAG_SERVICE_URL: http://rag-service:5002
      TA_SERVICE_URL: http://technical-analysis:5003
      MACRO_INDICATORS_URL: http://macro-indicators:5004
      KINH_DICH_URL: http://kinh-dich-service:5005
      ALERT_ENGINE_URL: http://alert-engine:5006
      VPS_HOST: 125.212.251.27
      VPS_SSH_USER: root
      VPS_SSH_KEY_PATH: /run/secrets/vps_ssh_key
      PORT: '3000'
      CLOUDFLARE_PATH_PREFIX: /vn-market
      CRON_BCTC_REPARSE_JOB: 0 21 * * *
      REFINE_FANOUT_CONCURRENCY: '5'
      REFINE_WINDOW_TIMEOUT_S: '120'
      REFINE_MAX_WINDOW_PAGES: '3'
    env_file:
    - .env
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - bun
      - -e
      - fetch('http://localhost:3000/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '2.0'
        reservations:
          memory: 512m
          cpus: '1.0'
    labels:
      app: vn-market-intelligence
      service: mcp-server
      cloudflare_path: /vn-market
  pdf-extractor:
    build:
      context: apps/pdf-extractor
      dockerfile: Dockerfile
    ports:
    - 5001:5001
    volumes:
    - market_data:/app/data
    - ./data/pdfs:/app/data/pdfs:ro
    - pek_model_cache:/app/PDF-Extract-Kit/models
    - bctc-page-images:/data/bctc-page-images
    environment:
      DB_PATH: /app/data/pdf_extractor.db
      STORAGE_DIR: /app/data/extractions
      LOG_LEVEL: INFO
      MCP_SERVER_URL: http://mcp-server:3000
      HUGGINGFACE_HUB_CACHE: /app/PDF-Extract-Kit/models/huggingface
      MODELSCOPE_CACHE: /app/PDF-Extract-Kit/models/modelscope
      YOLO_CONFIG_DIR: /app/PDF-Extract-Kit/models/yolo
      PADDLE_OCR_BASE_DIR: /app/PDF-Extract-Kit/models/paddleocr
      BCTC_RASTER_DPI: '150'
      BCTC_PAGE_TEXT_BACKEND: sqlite
      MARKET_DB_PATH: /app/data/market.db
      APP_ENV: production
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5001/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 2.5g
          cpus: '1.0'
        reservations:
          memory: 1g
          cpus: '0.5'
  rag-service:
    build:
      context: apps/rag-service
      dockerfile: Dockerfile
    ports:
    - 5002:5002
    volumes:
    - market_data:/app/data
    environment:
    - LANCEDB_PATH=/app/data/lancedb
    - DB_PATH=/app/data/rag_service.db
    - APP_ENV=production
    - EMBEDDING_CACHE_DIR=/opt/model-cache
    - LOG_LEVEL=INFO
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5002/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1.5g
          cpus: '1.0'
        reservations:
          memory: 1g
          cpus: '0.5'
  technical-analysis:
    build:
      context: apps/technical-analysis
      dockerfile: Dockerfile
    ports:
    - 5003:5003
    volumes:
    - market_data:/app/data
    environment:
    - PORT=5003
    - DB_PATH=/app/data/market.db
    - DB_READONLY=true
    - APP_ENV=production
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://localhost:5003/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.75'
        reservations:
          memory: 256m
          cpus: '0.25'
  macro-indicators:
    build:
      context: apps/macro-indicators
      dockerfile: Dockerfile
    ports:
    - 5004:5004
    volumes:
    - market_data:/app/data
    environment:
    - PORT=5004
    - DB_PATH=/app/data/market.db
    - DB_READONLY=true
    - COMMODITY_LIVE_MODE=true
    - APP_ENV=production
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://localhost:5004/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1.5g
          cpus: '0.5'
        reservations:
          memory: 1g
          cpus: '0.25'
    env_file:
    - .env
  stock-price:
    build:
      context: apps/stock-price
      dockerfile: Dockerfile
    ports:
    - 5010:5000
    volumes:
    - market_data:/app/data
    environment:
    - PORT=5000
    - DB_PATH=/app/data/market.db
    - STOCK_PRICE_DB_PATH=/app/data/stock_price.db
    - APP_ENV=production
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://localhost:5000/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.75'
        reservations:
          memory: 256m
          cpus: '0.25'
  api-gateway:
    build:
      context: apps/api-gateway
      dockerfile: Dockerfile
    ports:
    - 4000:4000
    environment:
    - PORT=4000
    - MCP_URL=http://mcp-server:3000
    - PDF_URL=http://pdf-extractor:5001
    - RAG_URL=http://rag-service:5002
    - TA_URL=http://technical-analysis:5003
    - MACRO_URL=http://macro-indicators:5004
    - STOCK_URL=http://stock-price:5000
    - KINH_DICH_URL=http://kinh-dich-service:5005
    - ALERT_URL=http://alert-engine:5006
    - NEWS_URL=http://news-fetch:5008
    - SYSTEM_MAP_PATH=/etc/system-map/system-map.json
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://localhost:4000/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.75'
        reservations:
          memory: 256m
          cpus: '0.25'
    volumes:
    - ./docs/data/system-map.json:/etc/system-map/system-map.json:ro
  kinh-dich-service:
    build:
      context: apps/kinh-dich-service
      dockerfile: Dockerfile
    ports:
    - 5005:5005
    volumes:
    - market_data:/app/data
    environment:
    - PORT=5005
    - DB_PATH=/app/data/market.db
    - DB_READONLY=true
    - APP_ENV=production
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://localhost:5005/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.75'
        reservations:
          memory: 256m
          cpus: '0.25'
  alert-engine:
    build:
      context: apps/alert-engine
      dockerfile: Dockerfile
    ports:
    - 5006:5006
    volumes:
    - market_data:/app/data
    environment:
    - PORT=5006
    - ALERT_ENGINE_DB_PATH=/app/data/alert_engine.db
    - APP_ENV=production
    env_file:
    - .env
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://localhost:5006/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.75'
        reservations:
          memory: 256m
          cpus: '0.25'
  news-fetch:
    build:
      context: apps/news-fetch
      dockerfile: Dockerfile
    ports:
    - 5008:5008
    volumes:
    - market_data:/app/data:ro
    environment:
    - PORT=5008
    - DB_PATH=/app/data/market.db
    - DB_READONLY=true
    - APP_ENV=production
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://localhost:5008/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '0.75'
        reservations:
          memory: 512m
          cpus: '0.5'
  frontend:
    build:
      context: apps/frontend
      dockerfile: Dockerfile
    ports:
    - 3001:3001
    depends_on:
    - api-gateway
    environment:
    - API_GATEWAY_URL=http://api-gateway:4000
    - MCP_SERVER_BASE_URL=http://mcp-server:3000
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://localhost:3001/
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.75'
        reservations:
          memory: 256m
          cpus: '0.25'
    labels:
      app: vn-market-intelligence
      service: frontend
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    ports:
    - 8191:8191
    environment:
    - LOG_LEVEL=info
    - TZ=Asia/Ho_Chi_Minh
    - CAPTCHA_SOLVER=none
    restart: unless-stopped
    shm_size: 1g
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8191/
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'
        reservations:
          memory: 256m
          cpus: '0.25'
volumes:
  market_data:
    driver: local
  pek_model_cache:
    driver: local
  bctc-page-images:
    driver: local
