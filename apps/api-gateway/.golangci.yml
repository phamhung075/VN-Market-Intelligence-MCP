# golangci-lint v2 configuration for apps/api-gateway
# Implements G4 (Architecture fence enforced) per pilot-charter.md.
#
# Linter: depguard — deny-list per package path prefix per fence rule.
# Four fence rules enforce the three-tier DDD architecture + I/O purity:
#   Fence-A: primitives → stdlib only; ALSO bans net/http + net/http/httputil
#   Fence-B: modules   → stdlib + primitives only
#   Fence-C: infra     → composition root (cmd/server/main.go) only
#   Fence-D: primitive→module cross-import forbidden
#
# api-gateway calibration (brownfield charter §G4):
#   pkg/primitive/** MUST be pure-function: zero I/O, zero net/http.
#   pkg/module/**    composes via RoutingPorts (interface), no direct dial.
#   cmd/server/main.go is the ONLY composition root.
#
# Task: P1-AG-E2  Goal: G4  Pilot: api-gateway  Language: Go
# Format: golangci-lint v2 (v2.12.2 — linters.settings, not linters-settings)

version: "2"

linters:
  default: none
  enable:
    - depguard
  settings:
    depguard:
      rules:
        # Fence-A: pkg/primitive/* is the bottom tier (pure-function layer).
        # Primitives compute single routing operations. They must NOT reach upward
        # into module, application, interface, or infrastructure layers.
        # They also MUST NOT import net/http or net/http/httputil — primitives are
        # pure-compute (zero I/O) per the api-gateway brownfield charter §G4.
        fence-a:
          files:
            - "**/pkg/primitive/**"
          deny:
            - pkg: "github.com/vn-market-intelligence/api-gateway/pkg/module"
              desc: "Fence-A: primitive must not import module layer"
            - pkg: "github.com/vn-market-intelligence/api-gateway/pkg/application"
              desc: "Fence-A: primitive must not import application layer"
            - pkg: "github.com/vn-market-intelligence/api-gateway/pkg/interface"
              desc: "Fence-A: primitive must not import interface layer"
            - pkg: "github.com/vn-market-intelligence/api-gateway/pkg/infrastructure"
              desc: "Fence-A: primitive must not import infrastructure layer"
            - pkg: "net/http"
              desc: "Fence-A: primitive must be pure-compute (zero I/O) — net/http forbidden"
            - pkg: "net/http/httputil"
              desc: "Fence-A: primitive must be pure-compute (zero I/O) — net/http/httputil forbidden"

        # Fence-B: pkg/module/* is the middle tier (composition layer).
        # Modules compose multiple primitives via RoutingPorts (Go interfaces).
        # They must NOT reach into the application layer (use cases), interface
        # layer (HTTP handlers), or infrastructure layer (adapters/repositories).
        # No direct net/http dial — all I/O is behind the RoutingPorts interface.
        fence-b:
          files:
            - "**/pkg/module/**"
          deny:
            - pkg: "github.com/vn-market-intelligence/api-gateway/pkg/application"
              desc: "Fence-B: module must not import application layer"
            - pkg: "github.com/vn-market-intelligence/api-gateway/pkg/interface"
              desc: "Fence-B: module must not import interface layer"
            - pkg: "github.com/vn-market-intelligence/api-gateway/pkg/infrastructure"
              desc: "Fence-B: module must not import infrastructure layer"

        # Fence-C: pkg/infrastructure constructors must only be wired from the
        # composition root (cmd/server/main.go). No other non-test file may import
        # pkg/infrastructure directly. Test files (*_test.go) are exempt to allow
        # infrastructure package self-tests.
        fence-c:
          files:
            - "!**/cmd/server/main.go"
            - "!**/*_test.go"
          deny:
            - pkg: "github.com/vn-market-intelligence/api-gateway/pkg/infrastructure"
              desc: "Fence-C: infrastructure wiring only allowed in cmd/server/main.go (composition root)"
