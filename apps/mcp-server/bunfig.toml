# ── Bun configuration ──────────────────────────────────────────────────────
# https://bun.sh/docs/runtime/bunfig

[install]
# Freeze exact versions in lockfile
exact = false
# Cache directory
cache = "~/.bun/install/cache"

[install.scopes]
# Use npm registry for all packages
"@modelcontextprotocol" = "https://registry.npmjs.org/"
"@huggingface"          = "https://registry.npmjs.org/"
"@lancedb"              = "https://registry.npmjs.org/"

[run]
# Use Bun runtime for all scripts
bun = true

[test]
# Test files pattern
coverage = true
# Default per-test timeout (ms) — SSC Puppeteer mock has ~5.8 s of setTimeout delays
timeout = 30000
preload = ["./src/__tests__/setup.ts"]
# Limit test discovery to src/ only — excludes dashboard/tests/ (Playwright specs)
root = "./src"
