# ── Bun configuration ──────────────────────────────────────────────────────
# https://bun.sh/docs/runtime/bunfig

[install]
# Freeze exact versions in lockfile
exact = false
# Cache directory
cache = "~/.bun/install/cache"

[install.scopes]
# Use npm registry for all packages
"@modelcontextprotocol" = "https://registry.npmjs.org/"
"@huggingface"          = "https://registry.npmjs.org/"
"@lancedb"              = "https://registry.npmjs.org/"

[run]
# Use Bun runtime for all scripts
bun = true

[test]
# coverage = false: prevents OOM crash on CI (full-suite coverage table exhausts runner RAM).
# CI gating uses bare `bun test` (no --coverage flag) — this setting suppresses the table.
# Local coverage: use `bun run test:cov` (scripts/test-coverage.sh) which temporarily
# sidesteps this flag via a bunfig-rename trap (bun 1.3.13: --coverage is ignored when
# bunfig sets coverage=false; --coverage only works when no bunfig override is present).
coverage = false
# Default per-test timeout (ms) — SSC Puppeteer mock has ~5.8 s of setTimeout delays
timeout = 30000
preload = ["./src/__tests__/setup.ts"]
# Limit test discovery to src/ only — excludes dashboard/tests/ (Playwright specs)
root = "./src"
