[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "pdf-extractor"
version = "1.0.0"
description = "Vietnamese BCTC PDF extraction microservice (FastAPI / DDD)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pdfplumber>=0.10.3",
    "aiohttp>=3.9.3",
    "Pillow>=10.2.0",
    "pytesseract>=0.3.10",
    "python-multipart>=0.0.9",
    "pydantic>=2.6.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "mypy>=1.9.0",
    "import-linter>=2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["__tests__"]
python_files = ["test_*.py"]
markers = [
    "slow: marks tests as slow (one-shot real OCR — do not run in CI loops)",
]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.importlinter]
root_packages = ["domain", "infrastructure", "application", "interface"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Fence-A: primitives must not import infrastructure, application, or interface"
type = "forbidden"
source_modules = [
    "domain.primitives",
]
forbidden_modules = [
    "infrastructure",
    "application",
    "interface",
]

[[tool.importlinter.contracts]]
name = "Fence-B: modules must not import infrastructure or interface; no cross-module imports"
type = "forbidden"
source_modules = [
    "domain.modules",
]
forbidden_modules = [
    "infrastructure",
    "interface",
]
