openapi: "3.0.3"
info:
  title: Technical Analysis Microservice
  description: >
    Computes RSI, MACD, Bollinger Bands, and Moving Averages from read-only
    market.db price history. Returns computed indicators via HTTP.
  version: "1.0.0"

servers:
  - url: http://localhost:5003
    description: Local development

paths:
  /health:
    get:
      operationId: getHealth
      summary: Health check
      description: Returns service liveness status.
      responses:
        "200":
          description: Service is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /ta/indicators:
    post:
      operationId: computeIndicators
      summary: Compute technical indicators for a stock
      description: >
        Accepts a stock code and lookback window (days). Returns RSI, MACD,
        Moving Averages, Bollinger Bands, and an overall trend signal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComputeTARequest"
      responses:
        "200":
          description: Indicators computed successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComputeTAResponse"
        "400":
          description: Invalid request body (missing code, invalid days, bad JSON).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal computation error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthResponse:
      type: object
      required: [status, service, port]
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: technical-analysis
        port:
          type: integer
          example: 5003

    ComputeTARequest:
      type: object
      required: [code, days]
      properties:
        code:
          type: string
          description: Vietnamese stock ticker (e.g. "VNM", "VCB").
          example: VNM
        days:
          type: integer
          minimum: 1
          description: Number of trading days of price history to use.
          example: 60

    ComputeTAResponse:
      type: object
      required: [code, trend, computedAt]
      properties:
        code:
          type: string
          example: VNM
        rsi:
          type: number
          nullable: true
          description: 14-period Wilder RSI value (0–100). Null if insufficient data.
          example: 58.3
        macd:
          nullable: true
          description: MACD line, signal line, and histogram. Null if insufficient data.
          allOf:
            - $ref: "#/components/schemas/MACDResult"
        movingAverages:
          $ref: "#/components/schemas/MovingAveragesResult"
        bollingerBands:
          nullable: true
          description: Bollinger Bands (upper/mid/lower). Null if insufficient data.
          allOf:
            - $ref: "#/components/schemas/BollingerBandsResult"
        trend:
          type: string
          enum: [BULLISH, BEARISH, NEUTRAL]
          description: Composite trend signal derived from indicators.
          example: BULLISH
        computedAt:
          type: string
          format: date-time
          description: ISO 8601 timestamp of computation.
          example: "2026-05-22T10:00:00.000Z"

    MACDResult:
      type: object
      required: [line, signal, histogram]
      properties:
        line:
          type: number
          example: 1.23
        signal:
          type: number
          example: 0.98
        histogram:
          type: number
          example: 0.25

    MovingAveragesResult:
      type: object
      required: [ma5, ma20, ma50]
      properties:
        ma5:
          type: number
          nullable: true
          example: 45200.0
        ma20:
          type: number
          nullable: true
          example: 44800.0
        ma50:
          type: number
          nullable: true
          example: 43500.0

    BollingerBandsResult:
      type: object
      required: [upper, mid, lower]
      properties:
        upper:
          type: number
          example: 47500.0
        mid:
          type: number
          example: 44800.0
        lower:
          type: number
          example: 42100.0

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: "code is required"
