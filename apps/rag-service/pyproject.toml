[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "rag-service"
version = "1.0.0"
description = "RAG microservice: LanceDB vector search + temporal decay ranking (FastAPI / DDD)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "lancedb>=0.6.0",
    "sentence-transformers>=2.7.0",
    "pydantic>=2.6.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "mypy>=1.9.0",
    "import-linter>=2.11",
    # FIX-RAG-EMBEDDER-IDLE-UNLOAD-ALLOCATOR-PAGES-NOT-RETURNED-TO-OS (2026-08-14):
    # fastapi.testclient.TestClient requires "httpx2" (not "httpx") against the
    # starlette version this repo resolves — see requirements.txt for the full
    # writeup. Kept in sync here so a host `pip install -e ".[dev]"` matches the
    # deployed image's actual TestClient dependency.
    "httpx2>=2.10.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["__tests__"]
python_files = ["test_*.py"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# import-linter (G4 architecture fence — SI-4 decision: grimp backend)
# Primary config: apps/rag-service/.importlinter (INI format, picked up by
# `lint-imports` automatically when run from apps/rag-service/).
# This section mirrors contracts for pyproject.toml-centric tooling.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["domain", "application", "infrastructure", "interface"]

[[tool.importlinter.contracts]]
name = "Fence-C: DDD layered architecture — domain is innermost, interface is outermost"
type = "layers"
layers = ["interface", "application", "domain"]

[[tool.importlinter.contracts]]
name = "Fence-A: primitives are independent — no primitive imports another primitive"
type = "independence"
modules = [
    "domain.primitive.similarity_scorer",
    "domain.primitive.relevance_threshold_gate",
    "domain.primitive.temporal_decay_scorer",
    "domain.primitive.top_k_selector",
    "domain.primitive.context_window_packer",
]

[[tool.importlinter.contracts]]
name = "Fence-B: retrieval module cannot import infrastructure"
type = "forbidden"
source_modules = ["domain.module.retrieval"]
forbidden_modules = ["infrastructure"]
